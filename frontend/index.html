<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise Workflow Management Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-light">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [workflows, setWorkflows] = useState([]);
      const [stats, setStats] = useState({ total: 0, completed: 0, in_progress: 0, pending: 0 });
      const [title, setTitle] = useState("");
      const [assignee, setAssignee] = useState("");
      const [priority, setPriority] = useState("Medium");
      const [departmentId, setDepartmentId] = useState(1);

      const fetchData = async () => {
        const [wfRes, stRes] = await Promise.all([
          fetch("/api/workflows"),
          fetch("/api/stats")
        ]);
        setWorkflows(await wfRes.json());
        setStats(await stRes.json());
      };

      useEffect(() => { fetchData(); }, []);

      const handleCreate = async (e) => {
        e.preventDefault();
        if (!title.trim() || !assignee.trim()) return;
        await fetch("/api/workflows", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title, assignee, priority, department_id: Number(departmentId) })
        });
        setTitle("");
        setAssignee("");
        fetchData();
      };

      const handleStatusChange = async (id, status) => {
        await fetch(`/api/workflows/${id}/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status })
        });
        fetchData();
      };

      const handleDelete = async (id) => {
        await fetch(`/api/workflows/${id}`, { method: "DELETE" });
        fetchData();
      };

      const badgeColor = (p) => ({
        Critical: "danger", High: "warning", Medium: "info", Low: "secondary"
      }[p] || "secondary");

      return (
        <div className="container py-4">
          <div className="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h2 className="fw-bold text-primary mb-0">Business Workflow Management Platform</h2>
              <small className="text-muted">Full-Stack Python REST API + Relational SQLite + React Dashboard</small>
            </div>
            <span className="badge bg-dark px-3 py-2">REST API v1.0</span>
          </div>

          <div className="row g-3 mb-4">
            <div className="col-md-3"><div className="card shadow-sm border-0 p-3"><h6>Total Tasks</h6><h3 className="fw-bold">{stats.total}</h3></div></div>
            <div className="col-md-3"><div className="card shadow-sm border-0 p-3 text-warning"><h6>Pending</h6><h3 className="fw-bold">{stats.pending}</h3></div></div>
            <div className="col-md-3"><div className="card shadow-sm border-0 p-3 text-primary"><h6>In Progress</h6><h3 className="fw-bold">{stats.in_progress}</h3></div></div>
            <div className="col-md-3"><div className="card shadow-sm border-0 p-3 text-success"><h6>Completed</h6><h3 className="fw-bold">{stats.completed}</h3></div></div>
          </div>

          <div className="card shadow-sm border-0 mb-4">
            <div className="card-body">
              <h5 className="card-title mb-3">Create New Business Workflow</h5>
              <form className="row g-2" onSubmit={handleCreate}>
                <div className="col-md-4">
                  <input className="form-control" placeholder="Workflow / Task Title" value={title} onChange={e => setTitle(e.target.value)} required />
                </div>
                <div className="col-md-3">
                  <input className="form-control" placeholder="Assignee Name" value={assignee} onChange={e => setAssignee(e.target.value)} required />
                </div>
                <div className="col-md-2">
                  <select className="form-select" value={departmentId} onChange={e => setDepartmentId(e.target.value)}>
                    <option value="1">IT Operations</option>
                    <option value="2">Cybersecurity & SOC</option>
                    <option value="3">Network Engineering</option>
                    <option value="4">Software Dev</option>
                  </select>
                </div>
                <div className="col-md-2">
                  <select className="form-select" value={priority} onChange={e => setPriority(e.target.value)}>
                    <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
                  </select>
                </div>
                <div className="col-md-1 d-grid">
                  <button className="btn btn-primary" type="submit">Add</button>
                </div>
              </form>
            </div>
          </div>

          <div className="card shadow-sm border-0">
            <div className="table-responsive">
              <table className="table table-hover align-middle mb-0">
                <thead className="table-dark">
                  <tr>
                    <th>ID</th><th>Task / Workflow</th><th>Department</th><th>Assignee</th><th>Priority</th><th>Status</th><th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {workflows.map(wf => (
                    <tr key={wf.id}>
                      <td>#{wf.id}</td>
                      <td className="fw-semibold">{wf.title}</td>
                      <td><span className="badge bg-light text-dark border">{wf.department}</span></td>
                      <td>{wf.assignee}</td>
                      <td><span className={`badge bg-${badgeColor(wf.priority)}`}>{wf.priority}</span></td>
                      <td>
                        <select className="form-select form-select-sm" value={wf.status} onChange={e => handleStatusChange(wf.id, e.target.value)}>
                          <option>Pending</option><option>In Progress</option><option>Completed</option>
                        </select>
                      </td>
                      <td>
                        <button className="btn btn-sm btn-outline-danger" onClick={() => handleDelete(wf.id)}>Delete</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
